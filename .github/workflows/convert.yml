name: Tamil PDF OCR Processing

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  ocr-job:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-tam curl parallel

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run Batch OCR Processing
      run: |
        python3 process_batch.py

    - name: Update Master Lexicon & Flag Corrections
      run: |
        python3 update_lexicon.py || echo "Lexicon update skipped or failed"

    - name: Commit and Push Progress
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        git add output_texts/ master_lexicon.json words_for_review.json 2>/dev/null || true
        
        if ! git diff --staged --quiet; then
          git commit -m "Automated OCR extraction batch [skip ci]"
          git push
        else
          echo "No changes to commit."
        fi

    - name: Trigger next batch if work remains
      if: env.MORE_WORK_REMAINS == 'true'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        echo "More pages remain! Triggering the next workflow run..."
        gh workflow run ocr.yml