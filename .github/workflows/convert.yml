name: Tamil PDF OCR Automation (10 Pages per Batch)

on:
  push:
    paths:
      - 'input_pdfs/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ocr:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr curl

      - name: Make Script Executable
        run: chmod +x ./ocr_tamil_pdf.sh

      - name: Process Link Files in 10-Page Chunks
        run: |
          mkdir -p output_texts temp_pdf

          for txt_file in input_pdfs/*.txt; do
            [ -e "$txt_file" ] || continue
            echo "Reading links from $txt_file..."

            while IFS= read -r url || [ -n "$url" ]; do
              # Clean carriage returns and trailing whitespace
              url=$(echo "$url" | tr -d '\r' | xargs)
              [[ -z "$url" || "$url" =~ ^# ]] && continue

              base_name=$(basename "${url%%\?*}" .pdf)
              final_output="output_texts/${base_name}.txt"

              # Skip if output file already exists
              if [ -f "$final_output" ]; then
                echo "Skipping $base_name: $final_output already exists."
                continue
              fi

              echo "----------------------------------------------"
              echo "Downloading PDF: $url"
              pdf_file="temp_pdf/${base_name}.pdf"
              curl -sSL -o "$pdf_file" "$url"

              # Get total page count using pdfinfo
              total_pages=$(pdfinfo "$pdf_file" | awk '/^Pages:/ {print $2}')
              echo "Total pages in $base_name: $total_pages"

              # Temporary directory to collect chunk outputs
              chunk_dir="temp_pdf/chunks_${base_name}"
              mkdir -p "$chunk_dir"

              # Process in 10-page batches
              batch_size=10
              for (( start=1; start<=total_pages; start+=batch_size )); do
                end=$(( start + batch_size - 1 ))
                if [ $end -gt $total_pages ]; then
                  end=$total_pages
                fi

                chunk_output="${chunk_dir}/chunk_${start}_${end}.txt"
                echo "Processing pages $start to $end of $total_pages..."
                
                # Execute script for current 10-page range
                ./ocr_tamil_pdf.sh "$pdf_file" "$chunk_output" "${start}-${end}"
              done

              # Concatenate all 10-page chunks into the final text file
              echo "Combining chunks into $final_output..."
              > "$final_output"
              for chunk in $(ls "$chunk_dir"/chunk_*.txt | sort -V); do
                cat "$chunk" >> "$final_output"
              done

              # Cleanup downloaded PDF and intermediate chunks
              rm -rf "$pdf_file" "$chunk_dir"
              echo "Finished processing $base_name!"
            done < "$txt_file"
          done

      - name: Commit and Push Output Text Files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add output_texts/*.txt

          if ! git diff --staged --quiet; then
            git commit -m "Automated 10-page chunked OCR extraction [skip ci]"
            git push
          else
            echo "No new OCR outputs to commit."
          fi
