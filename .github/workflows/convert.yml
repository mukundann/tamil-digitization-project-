name: Tamil PDF OCR Automation (Incremental Chunk Saving)

on:
  push:
    paths:
      - 'input_pdfs/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ocr:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr curl

      - name: Make Script Executable
        run: chmod +x ./ocr_tamil_pdf.sh

      - name: Pre-download Tamil Tesseract Language Pack
        run: |
          sudo curl -sSL -o /usr/share/tesseract-ocr/4.00/tessdata/tam.traineddata \
            "https://github.com/tesseract-ocr/tessdata_fast/raw/main/tam.traineddata" || \
          sudo curl -sSL -o /usr/share/tesseract-ocr/5/tessdata/tam.traineddata \
            "https://github.com/tesseract-ocr/tessdata_fast/raw/main/tam.traineddata"

      - name: Process Link Files and Save Incremental Chunks
        run: |
          mkdir -p output_texts temp_pdf

          for txt_file in input_pdfs/*.txt; do
            [ -e "$txt_file" ] || continue
            echo "Reading links from $txt_file..."

            while IFS= read -r url || [ -n "$url" ]; do
              # Clean carriage returns and trailing whitespace
              url=$(echo "$url" | tr -d '\r' | xargs)
              [[ -z "$url" || "$url" =~ ^# ]] && continue

              base_name=$(basename "${url%%\?*}" .pdf)
              final_output="output_texts/${base_name}.txt"

              # Skip if full merged text output already exists
              if [ -f "$final_output" ]; then
                echo "Skipping $base_name: Final output ($final_output) already exists."
                continue
              fi

              echo "----------------------------------------------"
              echo "Downloading PDF: $url"
              pdf_file="temp_pdf/${base_name}.pdf"
              curl -sSL -o "$pdf_file" "$url"

              # Get total page count using pdfinfo
              total_pages=$(pdfinfo "$pdf_file" | awk '/^Pages:/ {print $2}')
              echo "Total pages in $base_name: $total_pages"

              # Create persistent directory in output_texts/ for raw chunks
              chunk_dir="output_texts/chunks_${base_name}"
              mkdir -p "$chunk_dir"

              # Process in 10-page batches
              batch_size=10
              for (( start=1; start<=total_pages; start+=batch_size )); do
                end=$(( start + batch_size - 1 ))
                if [ $end -gt $total_pages ]; then
                  end=$total_pages
                fi

                # Zero-pad page numbers so files sort correctly (e.g., chunk_0001_0010.txt)
                start_fmt=$(printf "%04d" $start)
                end_fmt=$(printf "%04d" $end)
                chunk_output="${chunk_dir}/chunk_${start_fmt}_${end_fmt}.txt"

                # Check if this specific chunk was already processed in a previous job
                if [ -f "$chunk_output" ]; then
                  echo "Skipping pages $start to $end: Chunk file already exists."
                  continue
                fi

                echo "Processing pages $start to $end of $total_pages..."
                ./ocr_tamil_pdf.sh "$pdf_file" "$chunk_output" "${start}-${end}"
              done

              # Merge all completed chunks into final file once all pages are finished
              echo "Combining chunks into $final_output..."
              > "$final_output"
              for chunk in $(ls "$chunk_dir"/chunk_*.txt | sort -V); do
                cat "$chunk" >> "$final_output"
              done

              # Clean up temporary PDF file
              rm -f "$pdf_file"
              echo "Finished processing $base_name!"
            done < "$txt_file"
          done

      - name: Commit and Push Chunks and Final Output
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Stage all output text files including intermediate chunk folders
          git add output_texts/

          if ! git diff --staged --quiet; then
            git commit -m "Automated incremental OCR extraction [skip ci]"
            git push
          else
            echo "No new OCR outputs or chunks to commit."
          fi
