name: Tamil & Manipravalam PDF OCR Automation

on:
  push:
    paths:
      - 'input_pdfs/**'
  workflow_dispatch:
  repository_dispatch:
    types: [continue-ocr]

permissions:
  contents: write

jobs:
  ocr:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr curl python3  tesseract-ocr-tam tesseract-ocr-san poppler-utils parallel

      - name: Make Script Executable
        run: chmod +x ./ocr_tamil_pdf.sh

      - name: Process Books (Max 20 Pages per Workflow Run)
        run: |
          mkdir -p output_texts temp_pdf
          
          MORE_WORK_REMAINS=false

          for txt_file in input_pdfs/*.txt; do
            [ -e "$txt_file" ] || continue
            echo "Reading links from $txt_file..."

            while read -r url target_range _ || [ -n "$url" ]; do
              url=$(echo "$url" | tr -d '\r' | xargs)
              target_range=$(echo "${target_range:-}" | tr -d '\r' | xargs)

              [[ -z "$url" || "$url" =~ ^# ]] && continue

              base_name=$(basename "${url%%\?*}" .pdf)

              if [ -n "$target_range" ]; then
                final_output="output_texts/${base_name}_p${target_range}.txt"
                chunk_dir="output_texts/chunks_${base_name}_p${target_range}"
              else
                final_output="output_texts/${base_name}.txt"
                chunk_dir="output_texts/chunks_${base_name}"
              fi

              # Skip if book processing is completely finished
              if [ -f "$final_output" ]; then
                echo "Skipping $base_name: Final output ($final_output) already exists."
                continue
              fi

              echo "----------------------------------------------"
              echo "Downloading PDF: $url"
              pdf_file="temp_pdf/${base_name}.pdf"
              curl -sSL -o "$pdf_file" "$url"

              pdf_total=$(pdfinfo "$pdf_file" | awk '/^Pages:/ {print $2}')

              if [ -n "$target_range" ]; then
                req_start="${target_range%-*}"
                req_end="${target_range#*-}"
                [ "$req_end" -gt "$pdf_total" ] && req_end=$pdf_total
              else
                req_start=1
                req_end=$pdf_total
              fi

              mkdir -p "$chunk_dir"

              batch_size=10
              pages_processed_this_run=0
              max_pages_per_run=10

              for (( start=req_start; start<=req_end; start+=batch_size )); do
                end=$(( start + batch_size - 1 ))
                if [ $end -gt $req_end ]; then
                  end=$req_end
                fi

                start_fmt=$(printf "%04d" $start)
                end_fmt=$(printf "%04d" $end)
                chunk_output="${chunk_dir}/chunk_${start_fmt}_${end_fmt}.txt"

                # Skip chunks that were already processed in previous runs
                if [ -f "$chunk_output" ]; then
                  echo "Chunk already exists for pages $start to $end. Skipping..."
                  continue
                fi

                # Stop if we hit the 20-page limit for this run
                if [ $pages_processed_this_run -ge $max_pages_per_run ]; then
                  echo "Reached 10-page quota limit for this workflow run."
                  MORE_WORK_REMAINS=true
                  break
                fi

                echo "Processing pages $start to $end..."
                ./ocr_tamil_pdf.sh "$pdf_file" "$chunk_output" "${start}-${end}"

                chunk_page_count=$(( end - start + 1 ))
                pages_processed_this_run=$(( pages_processed_this_run + chunk_page_count ))
              done

              # Check if all chunks for the requested range are complete
              all_complete=true
              for (( check_start=req_start; check_start<=req_end; check_start+=batch_size )); do
                check_end=$(( check_start + batch_size - 1 ))
                [ $check_end -gt $req_end ] && check_end=$check_end
                
                c_start_fmt=$(printf "%04d" $check_start)
                c_end_fmt=$(printf "%04d" $check_end)
                if [ ! -f "${chunk_dir}/chunk_${c_start_fmt}_${c_end_fmt}.txt" ]; then
                  all_complete=false
                  break
                fi
              done

              # Merge into final output file if all requested pages are done
              if [ "$all_complete" = true ]; then
                echo "All pages completed! Combining chunks into $final_output..."
                > "$final_output"
                for chunk in $(ls "$chunk_dir"/chunk_*.txt | sort -V); do
                  cat "$chunk" >> "$final_output"
                done
                echo "Finished processing $base_name!"
              else
                echo "Partial progress saved for $base_name ($pages_processed_this_run pages processed this run)."
                MORE_WORK_REMAINS=true
              fi

              rm -f "$pdf_file"
            done < "$txt_file"
          done

          echo "MORE_WORK_REMAINS=$MORE_WORK_REMAINS" >> $GITHUB_ENV

      - name: Commit and Push Output Text Files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add output_texts/

          if ! git diff --staged --quiet; then
            git commit -m "Automated Manipravalam OCR extraction (20-page batch) [skip ci]"
            git push
          else
            echo "No new OCR outputs or chunks to commit."
          fi

      - name: Update Master Lexicon & Flag Corrections
        run: |
          python3 update_lexicon.py

      - name: Commit updated lexicon and flagged lists
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          # Safely stage files if they exist
          git add master_lexicon.json words_for_review.json 2>/dev/null || true

          # Commit and push only if changes were staged
          if ! git diff --staged --quiet; then
            git commit -m "Update master vocabulary & flagged review list [skip ci]"
            git push
          else
            echo "No changes to commit."
          fi

      - name: Trigger Next Batch Workflow if Unfinished
        if: env.MORE_WORK_REMAINS == 'true'
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.WORKFLOW_RETRIGGER_TOKEN }}
          event-type: continue-ocr
