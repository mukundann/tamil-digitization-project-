name: Tamil & Manipravalam PDF OCR Automation

on:
  push:
    branches: [ master, main ]
    paths:
      - 'input_pdfs/**'
  workflow_dispatch:
  repository_dispatch:
    types: [continue-ocr]

permissions:
  contents: write
  actions: write

jobs:
  ocr:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr curl python3 parallel

      - name: Pre-download Tamil and Sanskrit Tesseract Language Packs
        run: |
          # Detect Tesseract tessdata directory dynamically
          TESS_DIR="/usr/share/tesseract-ocr/4.00/tessdata"
          if [ ! -d "$TESS_DIR" ]; then
            TESS_DIR="/usr/share/tesseract-ocr/5/tessdata"
          fi
          
          sudo curl -sSL -o "$TESS_DIR/tam.traineddata" \
            "https://github.com/tesseract-ocr/tessdata_fast/raw/main/tam.traineddata"
          sudo curl -sSL -o "$TESS_DIR/san.traineddata" \
            "https://github.com/tesseract-ocr/tessdata_fast/raw/main/san.traineddata"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Make Scripts Executable
        run: |
          chmod +x ./ocr_tamil_pdf.sh || true
          chmod +x ./process_booklist.sh || true

      - name: Process Batch OCR / Booklist Extraction
        run: |
          if [ -f "./process_booklist.sh" ]; then
            ./process_booklist.sh
          elif [ -f "process_batch.py" ]; then
            python3 process_batch.py
          fi

      - name: Update Lexicon & Extract Review Data
        run: |
          python3 update_lexicon.py || echo "Lexicon update skipped or failed"

      - name: Commit and Push Output
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Add extracted texts, rendered page images, and review JSON files
          git add output_texts/ master_lexicon.json words_for_review.json 2>/dev/null || true

          if ! git diff --staged --quiet; then
            git commit -m "Automated OCR batch extraction & page rendering [skip ci]"
            git push
          else
            echo "No changes to commit."
          fi

      - name: Trigger Next Batch Workflow if Unfinished
        if: env.MORE_WORK_REMAINS == 'true'
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          event-type: continue-ocr