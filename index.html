<!DOCTYPE html>
<html lang="ta">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tamil OCR Split-View Editor</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      background: #f4f6f9;
    }

    header {
      background: #2c3e50;
      color: white;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header-controls {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .container {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    .sidebar {
      width: 300px;
      background: #fff;
      border-right: 1px solid #ccc;
      display: flex;
      flex-direction: column;
    }

    .sidebar-header {
      padding: 12px;
      background: #e9ecef;
      font-weight: bold;
      border-bottom: 1px solid #ccc;
      display: flex;
      justify-content: space-between;
    }

    .list-group {
      overflow-y: auto;
      flex: 1;
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .list-group-item {
      padding: 10px 12px;
      border-bottom: 1px solid #eee;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
    }

    .list-group-item.active {
      background-color: #007bff;
      color: white;
    }

    .main-split-content {
      flex: 1;
      display: flex;
      width: 100%;
    }

    .image-panel {
      flex: 1;
      background: #333;
      padding: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: auto;
    }

    .image-panel img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .editor-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 15px;
      background: #fff;
      border-left: 1px solid #ccc;
      overflow-y: auto;
    }

    textarea {
      width: 100%;
      height: 220px;
      font-size: 18px;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      resize: vertical;
    }

    .btn {
      padding: 8px 14px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-primary {
      background: #28a745;
      color: white;
    }

    .btn-secondary {
      background: #007bff;
      color: white;
    }

    .btn-done {
      background: #17a2b8;
      color: white;
    }

    .btn-nav {
      background: #6c757d;
      color: white;
    }

    .keyboard-container {
      background: #e9ecef;
      border: 1px solid #ccc;
      border-radius: 4px;
      padding: 8px;
      margin-top: 10px;
    }

    .keyboard-row {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-bottom: 4px;
    }

    .key {
      background: white;
      border: 1px solid #ced4da;
      padding: 5px 8px;
      font-size: 15px;
      cursor: pointer;
    }

    .key:hover {
      background: #007bff;
      color: white;
    }
  </style>
</head>

<body>
  <header>
    <h2>Tamil OCR Split-View Editor</h2>
    <div class="header-controls">
      <input type="file" id="jsonFileInput" accept=".js, .json" style="display: none;"
        onchange="handleFileSelect(event)">
      <button class="btn btn-secondary" onclick="document.getElementById('jsonFileInput').click()">Open File</button>
      <button class="btn btn-primary" id="saveBtn" onclick="saveFile()" disabled>Save File Back</button>
    </div>
  </header>

  <div class="container">
    <div class="sidebar">
      <div class="sidebar-header">
        <span>Segments</span>
        <span id="progressTracker">0/0 Done</span>
      </div>
      <div class="filter-section">
        <label for="bookSelect">Book:</label>
        <select id="bookSelect" onchange="loadBookPages()">
          <option value="">-- Select Book --</option>
        </select>

        <label for="pageSelect" style="margin-left: 15px;">Page:</label>
        <select id="pageSelect" onchange="loadPageData()">
          <option value="">-- Select Page --</option>
        </select>
      </div>
      <ul class="list-group" id="pasuramList">
        <li class="list-group-item">Load a file to begin...</li>
      </ul>
    </div>

    <div class="main-split-content">
      <div class="image-panel">
        <img id="pageViewer" src="" alt="Select a segment to load original page image">
      </div>

      <div class="editor-panel">
        <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
          <strong id="currentEditingLabel">Select a segment:</strong>
          <div>
            <button class="btn btn-done" id="markDoneBtn" onclick="toggleDoneState()" disabled>Mark as Done</button>
            <button class="btn btn-nav" id="prevBtn" onclick="navigate(-1)" disabled>Prev</button>
            <button class="btn btn-nav" id="nextBtn" onclick="navigate(1)" disabled>Next</button>
          </div>
        </div>

        <textarea id="pasuramEditor"
          placeholder="Loaded text will appear here... (Type English + Space to transliterate)"
          onkeydown="handleTransliterationKeyDown(event)"></textarea>

        <div class="keyboard-container">
          <div style="font-size:12px; font-weight:bold; margin-bottom:5px;">Virtual Tamil Keyboard</div>
          <div class="keyboard-row" id="vowelsRow"></div>
          <div class="keyboard-row" id="consonantsRow"></div>
          <div class="keyboard-row" id="modifiersRow"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>

</html>
