<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <title>Tamil Digitization - Multi-Book Proofreader</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Arial, sans-serif; height: 100vh; display: flex; flex-direction: column; background: #f4f6f9; }
        
        /* Top Navigation Header */
        .header { background: #2c3e50; color: white; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; }
        .controls { display: flex; gap: 10px; align-items: center; }
        .btn { padding: 6px 12px; background: #27ae60; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn:hover { background: #219150; }
        .btn-reset { background: #e74c3c; }
        .btn-reset:hover { background: #c0392b; }
        select { padding: 6px 10px; border-radius: 4px; font-weight: bold; font-size: 0.95em; outline: none; }

        /* Split Screen Container */
        .container { flex: 1; display: flex; overflow: hidden; }

        /* Left Pane: Page Image Viewer */
        .left-pane { flex: 1; background: #525659; display: flex; flex-direction: column; border-right: 2px solid #ccc; }
        .image-toolbar { background: #333; color: white; padding: 8px; display: flex; justify-content: center; gap: 15px; align-items: center; }
        .image-toolbar input { width: 60px; text-align: center; font-weight: bold; padding: 2px; }
        .image-viewport { flex: 1; overflow: auto; display: flex; justify-content: center; padding: 15px; }
        .image-viewport img { max-width: 100%; height: auto; box-shadow: 0 4px 8px rgba(0,0,0,0.3); background: white; }

        /* Right Pane: Scrollable Text Editor & Keyboard */
        .right-pane { flex: 1; display: flex; flex-direction: column; background: #fdf6e3; padding: 15px; position: relative; }
        .editor-header { font-size: 0.95em; color: #555; margin-bottom: 8px; font-weight: bold; display: flex; justify-content: space-between; }
        #textEditor { flex: 1; width: 100%; font-size: 1.15em; line-height: 1.8; padding: 15px; border: 1px solid #d3d3d3; border-radius: 4px; font-family: 'Segoe UI', sans-serif; resize: none; outline: none; background: white; overflow-y: auto; }

        /* Virtual Tamil Keyboard Styling */
        .keyboard-container { margin-top: 10px; background: #eaeaea; padding: 10px; border-radius: 6px; border: 1px solid #ccc; max-height: 180px; overflow-y: auto; }
        .keyboard-section-title { font-size: 0.8em; font-weight: bold; color: #444; margin: 4px 0 2px 0; }
        .keyboard-row { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
        .key-btn { padding: 5px 8px; font-size: 1em; background: white; border: 1px solid #bbb; border-radius: 3px; cursor: pointer; min-width: 32px; text-align: center; }
        .key-btn:hover { background: #3498db; color: white; border-color: #2980b9; }
    </style>
</head>
<body>

    <div class="header">
        <div class="controls">
            <label for="bookSelect" style="font-weight:bold;">Book:</label>
            <select id="bookSelect" onchange="switchBook(this.value)">
                <option value="sr194">sr194</option>
            </select>
        </div>
        <div class="controls">
            <input type="file" id="txtFileInput" accept=".txt" title="Load Custom Text File">
            <button class="btn" onclick="exportText()">Download Corrected Text</button>
            <button class="btn btn-reset" onclick="clearCurrentBookProgress()">Reset Book Progress</button>
            <button class="btn" onclick="saveFileDirectly()">Save File Back</button>
        </div>
    </div>

    <div class="container">
        <!-- Left Pane: Page-wise Image Viewer -->
        <div class="left-pane">
            <div class="image-toolbar">
                <button class="btn" style="padding: 4px 8px;" onclick="changePage(-1)">◀ Prev Page</button>
                <span>Page <input type="number" id="pageNumInput" value="1" min="1" onchange="goToPage(this.value)"></span>
                <button class="btn" style="padding: 4px 8px;" onclick="changePage(1)">Next Page ▶</button>
            </div>
            <div class="image-viewport">
                <img id="pageViewer" src="" alt="Loading page image...">
            </div>
        </div>

        <!-- Right Pane: Scrollable Text Editor & Keyboard -->
        <div class="right-pane">
            <div class="editor-header">
                <span>OCR Text Editor (<span id="currentBookLabel">sr194</span>):</span>
                <span id="posIndicator">Line: 1 | Col: 1</span>
            </div>
            <textarea id="textEditor" placeholder="Loading text..." onkeyup="handleTransliteration(event)"></textarea>

            <!-- Virtual Tamil Keyboard -->
            <div class="keyboard-container">
                <div class="keyboard-section-title">உயிரெழுத்துக்கள் (Vowels)</div>
                <div class="keyboard-row" id="vowelKeys"></div>

                <div class="keyboard-section-title">மெய்யெழுத்துக்கள் (Consonants)</div>
                <div class="keyboard-row" id="consonantKeys"></div>

                <div class="keyboard-section-title">உயிர்மெய் குறிகள் (Diacritics & Modifiers)</div>
                <div class="keyboard-row" id="diacriticKeys"></div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
